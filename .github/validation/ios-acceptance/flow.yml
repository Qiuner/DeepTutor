appId: org.reactjs.native.example.DeepTutorMobile
---
- launchApp
- extendedWaitUntil:
    visible: "Server address"
    timeout: 90000
- tapOn: "https://tutor.example.com"
- inputText: "https://localhost:18001"
- tapOn: "(?i)^connect$"
- extendedWaitUntil:
    visible: "Username"
    timeout: 20000
- tapOn: "Username"
- inputText: "nativefixture"
- tapOn: "Password"
- inputText: "wrongpassword"
- tapOn: "(?i)^sign in$"
- assertVisible: "Check your username and password."
- tapOn: "Password"
- inputText: "correctpassword"
- tapOn: "(?i)^sign in$"
- extendedWaitUntil:
    visible: "Connected"
    timeout: 20000
- tapOn: "Message"
- inputText: "First turn"
- tapOn: "(?i)^send$"
- assertVisible: "^First reply streamed correctly[.]$"
- tapOn: "Message"
- inputText: "Second turn"
- tapOn: "(?i)^send$"
- extendedWaitUntil:
    visible: "^Second reply resumed correctly[.]$"
    timeout: 25000
