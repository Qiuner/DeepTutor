name: iOS native acceptance
on:
  push:
    branches: [mobile/verify-ios-e2e-2915]
    paths: [.github/workflows/ios-native-acceptance.yml, .github/validation/ios-acceptance/**]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    name: Xcode UI acceptance on iOS
    runs-on: macos-26-intel
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45526143729
          name: deeptutor-ios-simulator-app
          path: ${{ runner.temp }}/ios-acceptance
      - run: npm ci
      - name: Install XcodeGen
        run: |
          command -v xcodegen || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen --version
      - name: Exercise the iOS app using XCTest
        run: bash ../../.github/validation/ios-acceptance/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deeptutor-ios-xctest-results
          path: ${{ runner.temp }}/ios-acceptance-results
          if-no-files-found: ignore
          retention-days: 7
