appId: com.deeptutormobile
---
- extendedWaitUntil:
    visible: "DeepTutor"
    timeout: 90000
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible: "Server address"
    timeout: 45000
- tapOn: "http://10.0.2.2:18001"
- eraseText: 32
- inputText: "http://127.0.0.1:18001"
- hideKeyboard
- tapOn: "(?i)^connect$"
- tapOn: "Username"
- inputText: "nativefixture"
- tapOn: "Password"
- inputText: "wrongpassword"
- hideKeyboard
- tapOn: "(?i)^sign in$"
- assertVisible: "Check your username and password."
- tapOn: "Password"
- inputText: "correctpassword"
- hideKeyboard
- tapOn: "(?i)^sign in$"
- assertVisible: "Connected"
- tapOn: "Message"
- inputText: "First turn"
- hideKeyboard
- tapOn: "(?i)^send$"
- assertVisible: "^First reply streamed correctly[.]$"
- tapOn: "Message"
- inputText: "Second turn"
- hideKeyboard
- tapOn: "(?i)^send$"
- extendedWaitUntil:
    visible: "^Second reply resumed correctly[.]$"
    timeout: 25000
